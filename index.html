
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dreamcore To-Do Tracker</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Dreamy background -->
    <div class="stars"></div>
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <!-- Floating decorations -->
    <div class="butterfly butterfly1">🦋</div>
    <div class="butterfly butterfly2">🦋</div>
    <div class="sparkle sparkle1">✦</div>
    <div class="sparkle sparkle2">✧</div>
    <div class="sparkle sparkle3">✦</div>

    <main class="app">

        <!-- Header -->
        <header class="header">

            <div>
                <p class="mini-title">✦ your little space ✦</p>

                <h1>
                    Dreamy
                    <span>To-Do</span>
                </h1>

                <p class="subtitle">
                    Turn your little dreams into little achievements ♡
                </p>
            </div>

            <button id="themeButton" class="icon-button" title="Change theme">
                🌙
            </button>

        </header>


        <!-- Progress Card -->
        <section class="progress-card">

            <div class="progress-info">

                <div>
                    <p>Today's progress</p>
                    <h2 id="progressText">0%</h2>
                </div>

                <div class="moon">
                    🌙
                </div>

            </div>

            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>

            <p id="taskCount">
                0 of 0 tasks completed
            </p>

        </section>


        <!-- Add Task -->
        <section class="add-card">

            <input
                type="text"
                id="taskInput"
                placeholder="What little dream shall we complete?"
                autocomplete="off"
            >

            <input
                type="date"
                id="dateInput"
            >

            <select id="priorityInput">

                <option value="low">
                    🌱 Low
                </option>

                <option value="medium" selected>
                    🌸 Medium
                </option>

                <option value="high">
                    ⭐ High
                </option>

            </select>

            <button id="addButton" class="add-button">
                <span>＋</span> Add Dream
            </button>

        </section>


        <!-- Filters -->
        <nav class="filters">

            <button class="filter active" data-filter="all">
                ✨ All
            </button>

            <button class="filter" data-filter="active">
                🌙 Active
            </button>

            <button class="filter" data-filter="completed">
                🦋 Completed
            </button>

        </nav>


        <!-- Task list -->
        <section id="taskList" class="task-list"></section>


        <!-- Empty state -->
        <div id="emptyState" class="empty-state">

            <div class="empty-moon">
                ☾
            </div>

            <h2>No dreams here yet...</h2>

            <p>
                Add a little task and watch your dream space grow ✦
            </p>

        </div>


        <!-- Footer -->
        <footer>
            made with ♡ and a little bit of magic
        </footer>

    </main>


    <!-- Edit Modal -->
    <div id="editModal" class="modal">

        <div class="modal-box">

            <button id="closeModal" class="close-button">
                ×
            </button>

            <h2>✦ Edit your dream</h2>

            <input
                type="text"
                id="editInput"
                placeholder="Edit task..."
            >

            <button id="saveEdit" class="add-button">
                Save Changes ♡
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
